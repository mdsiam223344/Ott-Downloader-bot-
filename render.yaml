services:
  - type: web
    name: telegram-video-link-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MAX_FILE_MB
        value: "45"
      - key: DB_PATH
        value: "downloads.db"
